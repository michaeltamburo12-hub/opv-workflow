name: Migrate production database

# Applies new files in supabase/migrations to the production database when
# they land on main. Requires the PROD_DB_URL repository secret (Supabase
# dashboard → Connect → Session pooler connection string, with password).

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for PROD_DB_URL secret
        id: secret
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          if [ -z "$PROD_DB_URL" ]; then
            echo "::warning::PROD_DB_URL secret is not set; skipping production migrations."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secret.outputs.present == 'true'
        with:
          version: latest

      - name: Pending migrations
        if: steps.secret.outputs.present == 'true'
        run: supabase migration list --db-url "$PROD_DB_URL"
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}

      - name: Apply migrations
        if: steps.secret.outputs.present == 'true'
        run: supabase db push --db-url "$PROD_DB_URL"
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
